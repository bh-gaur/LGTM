version: '3.8'

services:
  # 1. Visualization
  grafana:
    image: grafana/grafana:12.3.1
    container_name: lgtm-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_AUTH_ANONYMOUS_ENABLED=false
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning
    depends_on:
      - mimir
      - loki
      - tempo
    networks:
      - lgtm

  # 2. Metrics Backend
  mimir:
    image: grafana/mimir:3.1.2
    container_name: lgtm-mimir
    command: -config.file=/etc/mimir/mimir-config.yaml -target=all
    ports:
      - "9009:9009"
    volumes:
      - ./mimir:/etc/mimir
    networks:
      - lgtm

  # 3. Logs Backend
  loki:
    image: grafana/loki:2.9.13
    container_name: lgtm-loki
    command: -config.file=/etc/loki/loki-config.yaml -target=all
    ports:
      - "3100:3100"
    volumes:
      - ./loki:/etc/loki
    networks:
      - lgtm

  # 4. Traces Backend
  tempo:
    image: grafana/tempo:2.9.0
    container_name: lgtm-tempo
    command: -config.file=/etc/tempo/tempo-config.yaml -target=all
    ports:
      - "3200:3200"
      # port 4317 (OTLP gRPC) is internal only — otel-collector reaches it via Docker network
    volumes:
      - ./tempo:/etc/tempo
    networks:
      - lgtm


  # 5. Telemetry Collector (OpenTelemetry Collector Contrib)
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.98.0
    container_name: lgtm-otel-collector
    command: ["--config=/etc/otel-collector/otel-collector-config.yaml"]
    ports:
      - "4317:4317"   # OTLP gRPC receiver
      - "4318:4318"   # OTLP HTTP receiver
      - "8888:8888"   # Collector self-metrics (Prometheus scrape)
      - "13133:13133" # Health check extension
    volumes:
      - ./otel-collector:/etc/otel-collector
    environment:
      - MIMIR_ENDPOINT=${MIMIR_ENDPOINT:-http://mimir:9009/otlp}
      - LOKI_PUSH_URL=${LOKI_PUSH_URL:-http://loki:3100/otlp}
      - TEMPO_ENDPOINT=${TEMPO_ENDPOINT:-tempo:4317}
      - NODE_APP_SCRAPE_TARGET=${NODE_APP_SCRAPE_TARGET:-node-app:8081}
    depends_on:
      - mimir
      - loki
      - tempo
    healthcheck:
      test: ["NONE"]
    networks:
      - lgtm

  # 6. Apache Kafka Message Broker (KRaft Mode)
  kafka:
    image: apache/kafka:3.9.0
    container_name: lgtm-kafka
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:9093'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT'
      KAFKA_LISTENERS: 'PLAINTEXT://kafka:9092,CONTROLLER://kafka:9093,PLAINTEXT_HOST://0.0.0.0:29092'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_LOG_DIRS: '/tmp/kraft-combined-logs'
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
      CLUSTER_ID: 'MkU3OEVBNTcwNTJENDM2Qk'
    networks:
      - lgtm

  # 7. Python Application
  python-app:
    image: bhgaur/python-app-image:python-app
    build:
      context: ../../apps
      dockerfile: python-app/Dockerfile
    container_name: python-app
    command: python app.py
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - ENABLE_OBSERVABILITY=${ENABLE_OBSERVABILITY:-true}
      - KAFKA_BROKERS=kafka:9092
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=lgtmdb
      - POSTGRES_USER=lgtmuser
      - POSTGRES_PASSWORD=lgtmpass
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4318
      - OTEL_EXPORTER_OTLP_PROTOCOL=http/protobuf
      - OTEL_SERVICE_NAME=python-app
      - OTEL_LOGS_EXPORTER=otlp
      - OTEL_METRICS_EXPORTER=otlp
      - OTEL_TRACES_EXPORTER=otlp
      - OTEL_METRIC_EXPORT_INTERVAL=10000
      - OTEL_METRICS_EXEMPLAR_FILTER=always_on
    depends_on:
      - otel-collector
      - postgres
      - kafka
    networks:
      - lgtm

  # 8. Node.js Application
  node-app:
    image: bhgaur/python-app-image:node-app
    build:
      context: ../../apps
      dockerfile: node-app/Dockerfile
    container_name: node-app
    ports:
      - "8081:8081"
    environment:
      - PORT=8081
      - ENABLE_OBSERVABILITY=${ENABLE_OBSERVABILITY:-true}
      - PYTHON_SERVICE_URL=http://python-app:5000
      - KAFKA_BROKERS=kafka:9092
      - REDIS_HOST=redis
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4318
      - OTEL_SERVICE_NAME=node-app
      - OTEL_METRICS_EXEMPLAR_FILTER=always_on
    depends_on:
      - python-app
      - otel-collector
      - kafka
      - redis
    networks:
      - lgtm

  # 8. PostgreSQL Database Infrastructure
  postgres:
    image: postgres:15-alpine
    container_name: lgtm-postgres
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=lgtmdb
      - POSTGRES_USER=lgtmuser
      - POSTGRES_PASSWORD=lgtmpass
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lgtmuser -d lgtmdb"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - lgtm

  # 9. Redis Cache Layer
  redis:
    image: redis:7-alpine
    container_name: lgtm-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - lgtm

  # 10. Auth Service
  auth-service:
    image: bhgaur/python-app-image:auth-service
    build:
      context: ../../apps
      dockerfile: auth-service/Dockerfile
    container_name: auth-service
    ports:
      - "8082:8082"
    environment:
      - PORT=8082
      - ENABLE_OBSERVABILITY=${ENABLE_OBSERVABILITY:-true}
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4318
      - OTEL_SERVICE_NAME=auth-service
    depends_on:
      - otel-collector
    networks:
      - lgtm

  # 11. Go Gin App
  go-app:
    image: bhgaur/python-app-image:go-app
    build:
      context: ../../apps
      dockerfile: go-app/Dockerfile
    container_name: go-app
    ports:
      - "8083:8083"
    environment:
      - PORT=8083
      - PYTHON_SERVICE_URL=http://python-app:5000
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4318
      - OTEL_SERVICE_NAME=go-app
    depends_on:
      - otel-collector
      - python-app
    networks:
      - lgtm

  # 12. Notification Service
  notification-service:
    image: bhgaur/python-app-image:notification-service
    build:
      context: ../../apps
      dockerfile: notification-service/Dockerfile
    container_name: notification-service
    ports:
      - "8084:8084"
    environment:
      - PORT=8084
      - ENABLE_OBSERVABILITY=${ENABLE_OBSERVABILITY:-true}
      - KAFKA_BROKERS=kafka:9092
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4318
      - OTEL_SERVICE_NAME=notification-service
    depends_on:
      - otel-collector
      - kafka
    networks:
      - lgtm

  # 13. DB Sync Service
  db-sync-service:
    image: bhgaur/python-app-image:db-sync-service
    build:
      context: ../../apps
      dockerfile: db-sync-service/Dockerfile
    container_name: db-sync-service
    ports:
      - "8085:8085"
    environment:
      - PORT=8085
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=lgtmdb
      - POSTGRES_USER=lgtmuser
      - POSTGRES_PASSWORD=lgtmpass
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4318
      - OTEL_SERVICE_NAME=db-sync-service
    depends_on:
      - otel-collector
      - postgres
    networks:
      - lgtm

  # 14. Analytics Service
  analytics-service:
    image: bhgaur/python-app-image:analytics-service
    build:
      context: ../../apps
      dockerfile: analytics-service/Dockerfile
    container_name: analytics-service
    ports:
      - "8086:8086"
    environment:
      - PORT=8086
      - ENABLE_OBSERVABILITY=${ENABLE_OBSERVABILITY:-true}
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=lgtmdb
      - POSTGRES_USER=lgtmuser
      - POSTGRES_PASSWORD=lgtmpass
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4318
      - OTEL_SERVICE_NAME=analytics-service
    depends_on:
      - otel-collector
      - postgres
    networks:
      - lgtm

  # 15. Recommendation Service
  recommendation-service:
    image: bhgaur/python-app-image:python-app
    build:
      context: ../../apps
      dockerfile: python-app/Dockerfile
    container_name: recommendation-service
    command: gunicorn --workers=4 --threads=2 --worker-class=gthread --bind=0.0.0.0:5001 --timeout=120 app:app
    ports:
      - "5001:5001"
    environment:
      - PORT=5001
      - ENABLE_OBSERVABILITY=${ENABLE_OBSERVABILITY:-true}
      - KAFKA_BROKERS=kafka:9092
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=lgtmdb
      - POSTGRES_USER=lgtmuser
      - POSTGRES_PASSWORD=lgtmpass
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4318
      - OTEL_EXPORTER_OTLP_PROTOCOL=http/protobuf
      - OTEL_SERVICE_NAME=recommendation-service
      - OTEL_LOGS_EXPORTER=otlp
      - OTEL_METRICS_EXPORTER=otlp
      - OTEL_TRACES_EXPORTER=otlp
      - OTEL_METRIC_EXPORT_INTERVAL=10000
      - OTEL_METRICS_EXEMPLAR_FILTER=always_on
    depends_on:
      - otel-collector
      - postgres
      - kafka
    networks:
      - lgtm

  # 16. Inventory Service
  inventory-service:
    image: bhgaur/python-app-image:go-app
    build:
      context: ../../apps
      dockerfile: go-app/Dockerfile
    container_name: inventory-service
    ports:
      - "8087:8087"
    environment:
      - PORT=8087
      - PYTHON_SERVICE_URL=http://python-app:5000
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4318
      - OTEL_SERVICE_NAME=inventory-service
    depends_on:
      - otel-collector
      - python-app
    networks:
      - lgtm

  # 17. Audit Service
  audit-service:
    image: bhgaur/python-app-image:python-app
    build:
      context: ../../apps
      dockerfile: python-app/Dockerfile
    container_name: audit-service
    command: gunicorn --workers=4 --threads=2 --worker-class=gthread --bind=0.0.0.0:5002 --timeout=120 app:app
    ports:
      - "5002:5002"
    environment:
      - PORT=5002
      - ENABLE_OBSERVABILITY=${ENABLE_OBSERVABILITY:-true}
      - KAFKA_BROKERS=kafka:9092
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=lgtmdb
      - POSTGRES_USER=lgtmuser
      - POSTGRES_PASSWORD=lgtmpass
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4318
      - OTEL_EXPORTER_OTLP_PROTOCOL=http/protobuf
      - OTEL_SERVICE_NAME=audit-service
      - OTEL_LOGS_EXPORTER=otlp
      - OTEL_METRICS_EXPORTER=otlp
      - OTEL_TRACES_EXPORTER=otlp
      - OTEL_METRIC_EXPORT_INTERVAL=10000
      - OTEL_METRICS_EXEMPLAR_FILTER=always_on
    depends_on:
      - otel-collector
      - postgres
      - kafka
    networks:
      - lgtm

  # 18. Alerting Service
  alerting-service:
    image: bhgaur/python-app-image:notification-service
    build:
      context: ../../apps
      dockerfile: notification-service/Dockerfile
    container_name: alerting-service
    ports:
      - "8088:8088"
    environment:
      - PORT=8088
      - ENABLE_OBSERVABILITY=${ENABLE_OBSERVABILITY:-true}
      - KAFKA_BROKERS=kafka:9092
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4318
      - OTEL_SERVICE_NAME=alerting-service
    depends_on:
      - otel-collector
      - kafka
    networks:
      - lgtm

  # 19. Reporting Service
  reporting-service:
    image: bhgaur/python-app-image:python-app
    build:
      context: ../../apps
      dockerfile: python-app/Dockerfile
    container_name: reporting-service
    command: gunicorn --workers=4 --threads=2 --worker-class=gthread --bind=0.0.0.0:5003 --timeout=120 app:app
    ports:
      - "5003:5003"
    environment:
      - PORT=5003
      - ENABLE_OBSERVABILITY=${ENABLE_OBSERVABILITY:-true}
      - KAFKA_BROKERS=kafka:9092
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=lgtmdb
      - POSTGRES_USER=lgtmuser
      - POSTGRES_PASSWORD=lgtmpass
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4318
      - OTEL_EXPORTER_OTLP_PROTOCOL=http/protobuf
      - OTEL_SERVICE_NAME=reporting-service
      - OTEL_LOGS_EXPORTER=otlp
      - OTEL_METRICS_EXPORTER=otlp
      - OTEL_TRACES_EXPORTER=otlp
      - OTEL_METRIC_EXPORT_INTERVAL=10000
      - OTEL_METRICS_EXEMPLAR_FILTER=always_on
    depends_on:
      - otel-collector
      - postgres
      - kafka
    networks:
      - lgtm

networks:
  lgtm:
    name: lgtm-network
    driver: bridge

volumes:
  postgres_data:
