# Global configuration options
global:
  # Toggle observability telemetry (tracing, metrics, OTLP logs)
  enableObservability: true
  # The StorageClass to use for persistent volumes (e.g. "gp3" on AWS EKS).
  # If empty or null, the Kubernetes cluster's default StorageClass is used.
  storageClass: "gp3"

# Node.js Application configuration
nodeApp:
  replicaCount: 1
  image:
    repository: "lgtm-node-app"
    tag: "latest"
    pullPolicy: "IfNotPresent"
  service:
    type: "ClusterIP"
    port: 8081

# Python Application configuration
pythonApp:
  replicaCount: 1
  image:
    repository: "lgtm-python-app"
    tag: "latest"
    pullPolicy: "IfNotPresent"
  service:
    type: "ClusterIP"
    port: 5000

# Auth Service configuration
authService:
  replicaCount: 1
  image:
    repository: "lgtm-auth-service"
    tag: "latest"
    pullPolicy: "IfNotPresent"
  service:
    type: "ClusterIP"
    port: 8082

# Go prime factorization App configuration
goApp:
  replicaCount: 1
  image:
    repository: "lgtm-go-app"
    tag: "latest"
    pullPolicy: "IfNotPresent"
  service:
    type: "ClusterIP"
    port: 8083

# Python Notification Service configuration
notificationService:
  replicaCount: 1
  image:
    repository: "lgtm-notification-service"
    tag: "latest"
    pullPolicy: "IfNotPresent"
  service:
    type: "ClusterIP"
    port: 8084

# Go Database Sync Service configuration
dbSyncService:
  replicaCount: 1
  image:
    repository: "lgtm-db-sync-service"
    tag: "latest"
    pullPolicy: "IfNotPresent"
  service:
    type: "ClusterIP"
    port: 8085

# Python Analytics Service configuration
analyticsService:
  replicaCount: 1
  image:
    repository: "lgtm-analytics-service"
    tag: "latest"
    pullPolicy: "IfNotPresent"
  service:
    type: "ClusterIP"
    port: 8086

# PostgreSQL Database Infrastructure configuration
postgres:
  image:
    repository: "postgres"
    tag: "15-alpine"
    pullPolicy: "IfNotPresent"
  database: "lgtmdb"
  user: "lgtmuser"
  password: "lgtmpass"
  persistence:
    size: "1Gi"

# Apache Kafka Message Broker configuration
kafka:
  replicaCount: 1
  image:
    repository: "apache/kafka"
    tag: "latest"
    pullPolicy: "IfNotPresent"
  service:
    type: "ClusterIP"
    port: 9092

# Redis Cache configuration
redis:
  replicaCount: 1
  image:
    repository: "redis"
    tag: "7-alpine"
    pullPolicy: "IfNotPresent"
  service:
    type: "ClusterIP"
    port: 6379

# Grafana Visualization configuration
grafana:
  replicaCount: 1
  image:
    repository: "grafana/grafana"
    tag: "10.4.2"
    pullPolicy: "IfNotPresent"
  service:
    type: "LoadBalancer"
    port: 80
    targetPort: 3000

# Grafana Alloy Telemetry Agent configuration
alloy:
  replicaCount: 1
  image:
    repository: "grafana/alloy"
    tag: "v1.1.0"
    pullPolicy: "IfNotPresent"
  service:
    type: "ClusterIP"
    port: 12345

# Loki logs database configuration
loki:
  image:
    repository: "grafana/loki"
    tag: "2.9.8"
    pullPolicy: "IfNotPresent"
  service:
    port: 3100
  persistence:
    enabled: true
    size: "5Gi"

# Mimir metrics database configuration
mimir:
  image:
    repository: "grafana/mimir"
    tag: "2.12.0"
    pullPolicy: "IfNotPresent"
  service:
    port: 9009
  persistence:
    enabled: true
    size: "5Gi"

# Tempo traces database configuration
tempo:
  image:
    repository: "grafana/tempo"
    tag: "2.4.1"
    pullPolicy: "IfNotPresent"
  service:
    port: 3200
    otlpPort: 4317
  persistence:
    enabled: true
    size: "10Gi"
