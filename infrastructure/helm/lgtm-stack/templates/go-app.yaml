apiVersion: apps/v1
kind: Deployment
metadata:
  name: go-app
  labels:
    app: go-app
    {{- include "lgtm-stack.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.goApp.replicaCount }}
  selector:
    matchLabels:
      app: go-app
  template:
    metadata:
      labels:
        app: go-app
        {{- include "lgtm-stack.selectorLabels" . | nindent 8 }}
    spec:
      containers:
        - name: go-app
          image: "{{ .Values.goApp.image.repository }}{{ if not (contains ":" .Values.goApp.image.repository) }}:{{ .Values.goApp.image.tag }}{{ end }}"
          imagePullPolicy: {{ .Values.goApp.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.goApp.service.port }}
              protocol: TCP
          env:
            - name: PORT
              value: "{{ .Values.goApp.service.port }}"
            - name: ENABLE_OBSERVABILITY
              value: "{{ .Values.global.enableObservability }}"
            - name: OTEL_SERVICE_NAME
              value: "go-app"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "alloy:4318"
            - name: PYTHON_SERVICE_URL
              value: "http://python-app:{{ .Values.pythonApp.service.port | default 5000 }}"
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
      imagePullSecrets:
        - name: dockerhub-secret
---
apiVersion: v1
kind: Service
metadata:
  name: go-app
  labels:
    app: go-app
    {{- include "lgtm-stack.labels" . | nindent 4 }}
spec:
  type: {{ .Values.goApp.service.type }}
  ports:
    - port: {{ .Values.goApp.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    app: go-app
    {{- include "lgtm-stack.selectorLabels" . | nindent 4 }}
