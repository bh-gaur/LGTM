apiVersion: apps/v1
kind: Deployment
metadata:
  name: db-sync-service
  labels:
    app: db-sync-service
    {{- include "lgtm-stack.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.dbSyncService.replicaCount }}
  selector:
    matchLabels:
      app: db-sync-service
  template:
    metadata:
      labels:
        app: db-sync-service
        {{- include "lgtm-stack.selectorLabels" . | nindent 8 }}
    spec:
      containers:
        - name: db-sync-service
          image: "{{ .Values.dbSyncService.image.repository }}{{ if not (contains ":" .Values.dbSyncService.image.repository) }}:{{ .Values.dbSyncService.image.tag }}{{ end }}"
          imagePullPolicy: {{ .Values.dbSyncService.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.dbSyncService.service.port }}
              protocol: TCP
          env:
            - name: PORT
              value: "{{ .Values.dbSyncService.service.port }}"
            - name: ENABLE_OBSERVABILITY
              value: "{{ .Values.global.enableObservability }}"
            - name: POSTGRES_HOST
              value: "postgres"
            - name: POSTGRES_PORT
              value: "5432"
            - name: POSTGRES_DB
              value: "{{ .Values.postgres.database }}"
            - name: POSTGRES_USER
              value: "{{ .Values.postgres.user }}"
            - name: POSTGRES_PASSWORD
              value: "{{ .Values.postgres.password }}"
            - name: OTEL_SERVICE_NAME
              value: "db-sync-service"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "alloy:4318"
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 15
      imagePullSecrets:
        - name: dockerhub-secret
---
apiVersion: v1
kind: Service
metadata:
  name: db-sync-service
  labels:
    app: db-sync-service
    {{- include "lgtm-stack.labels" . | nindent 4 }}
spec:
  type: {{ .Values.dbSyncService.service.type }}
  ports:
    - port: {{ .Values.dbSyncService.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    app: db-sync-service
    {{- include "lgtm-stack.selectorLabels" . | nindent 4 }}
