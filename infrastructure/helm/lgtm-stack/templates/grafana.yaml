apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-provisioning
  labels:
    {{- include "lgtm-stack.labels" . | nindent 4 }}
data:
  datasources.yaml: |
    apiVersion: 1

    datasources:
      - name: Prometheus
        type: prometheus
        access: proxy
        url: http://mimir:9009/prometheus
        isDefault: true
        uid: prometheus
        jsonData:
          httpMethod: POST
          exemplarTraceIdDestinations:
            - datasourceUid: tempo
              name: trace_id
            - datasourceUid: tempo
              name: traceID

      - name: Loki
        type: loki
        access: proxy
        url: http://loki:3100
        uid: loki
        jsonData:
          derivedFields:
            - datasourceUid: tempo
              matcherRegex: '(?i)(?:trace_?id|traceid)[^a-f0-9]+([a-f0-9]{16,32})'
              name: TraceID
              url: "${__value.raw}"
              urlDisplayLabel: "View Trace in Tempo"

      - name: Tempo
        type: tempo
        access: proxy
        url: http://tempo:3200
        uid: tempo
        jsonData:
          tracesToLogsV2:
            datasourceUid: 'loki'
            spanStartTimeShift: '-1m'
            spanEndTimeShift: '1m'
            tags:
              - key: 'service.name'
                value: 'service_name'
              - key: 'service.name'
                value: 'job'
              - key: 'service_name'
                value: 'service_name'
              - key: 'service_name'
                value: 'job'
            filterByTraceID: true
            filterBySpanID: false
  alerting.yaml: |
    apiVersion: 1
    groups:
      - orgId: 1
        name: "LGTM Alerts"
        folder: "System Alerts"
        interval: 10s
        rules:
          - uid: "api_high_error_rate"
            title: "High API Error Rate Alerts"
            condition: A
            data:
              - refId: A
                relativeTimeRange:
                  from: 300
                  to: 0
                datasourceUid: prometheus
                model:
                  expr: sum(rate(calculation_requests_total[1m])) > 0.1
                  intervalMs: 10000
                  maxDataPoints: 100
                  refId: A
            noDataState: OK
            execErrState: Alerting
            for: 15s
            annotations:
              summary: "Node.js Gateway experiences high API traffic error spikes."
              description: "Calculation requests error rate exceeds threshold of 10% over the last minute."
            labels:
              severity: critical
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  labels:
    {{- include "lgtm-stack.labels" . | nindent 4 }}
spec:
  type: {{ .Values.grafana.service.type }}
  ports:
    - port: {{ .Values.grafana.service.port }}
      targetPort: {{ .Values.grafana.service.targetPort }}
      protocol: TCP
      name: http
  selector:
    app: grafana
    {{- include "lgtm-stack.selectorLabels" . | nindent 4 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  labels:
    {{- include "lgtm-stack.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.grafana.replicaCount }}
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
        {{- include "lgtm-stack.selectorLabels" . | nindent 8 }}
    spec:
      containers:
        - name: grafana
          image: "{{ .Values.grafana.image.repository }}{{ if not (contains ":" .Values.grafana.image.repository) }}:{{ .Values.grafana.image.tag }}{{ end }}"
          imagePullPolicy: {{ .Values.grafana.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          env:
            - name: GF_SECURITY_ADMIN_USER
              value: "admin"
            - name: GF_SECURITY_ADMIN_PASSWORD
              value: "admin"
            - name: GF_AUTH_ANONYMOUS_ENABLED
              value: "false"
          volumeMounts:
            - name: provisioning-datasources
              mountPath: /etc/grafana/provisioning/datasources
            - name: provisioning-alerting
              mountPath: /etc/grafana/provisioning/alerting
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
      volumes:
        - name: provisioning-datasources
          configMap:
            name: grafana-provisioning
            items:
              - key: datasources.yaml
                path: datasources.yaml
        - name: provisioning-alerting
          configMap:
            name: grafana-provisioning
            items:
              - key: alerting.yaml
                path: alerting.yaml
