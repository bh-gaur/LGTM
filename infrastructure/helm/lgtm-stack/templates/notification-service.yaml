apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-service
  labels:
    app: notification-service
    {{- include "lgtm-stack.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.notificationService.replicaCount }}
  selector:
    matchLabels:
      app: notification-service
  template:
    metadata:
      labels:
        app: notification-service
        {{- include "lgtm-stack.selectorLabels" . | nindent 8 }}
    spec:
      containers:
        - name: notification-service
          image: "{{ .Values.notificationService.image.repository }}{{ if not (contains ":" .Values.notificationService.image.repository) }}:{{ .Values.notificationService.image.tag }}{{ end }}"
          imagePullPolicy: {{ .Values.notificationService.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.notificationService.service.port }}
              protocol: TCP
          env:
            - name: PORT
              value: "{{ .Values.notificationService.service.port }}"
            - name: ENABLE_OBSERVABILITY
              value: "{{ .Values.global.enableObservability }}"
            - name: KAFKA_BROKERS
              value: "kafka:{{ .Values.kafka.service.port | default 9092 }}"
            - name: OTEL_SERVICE_NAME
              value: "notification-service"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://alloy:4318"
            - name: OTEL_EXPORTER_OTLP_PROTOCOL
              value: "http/protobuf"
            - name: OTEL_TRACES_EXPORTER
              value: "otlp"
            - name: OTEL_METRICS_EXPORTER
              value: "otlp"
            - name: OTEL_LOGS_EXPORTER
              value: "otlp"
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 15
      imagePullSecrets:
        - name: dockerhub-secret
---
apiVersion: v1
kind: Service
metadata:
  name: notification-service
  labels:
    app: notification-service
    {{- include "lgtm-stack.labels" . | nindent 4 }}
spec:
  type: {{ .Values.notificationService.service.type }}
  ports:
    - port: {{ .Values.notificationService.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    app: notification-service
    {{- include "lgtm-stack.selectorLabels" . | nindent 4 }}
