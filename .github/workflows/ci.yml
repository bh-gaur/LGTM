name: LGTM Stack CI Validation

on:
  push:
    branches: [ main,  add/features]
  pull_request:
    branches: [ main, add/features ]

jobs:
  helm-validation:
    name: Helm Chart Linting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: 'v3.12.0'

      - name: Lint Helm Charts
        run: |
          helm lint helm/lgtm-stack

  node-validation:
    name: Node.js Lint & Syntax
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: |
          cd apps/node-app
          npm install

      - name: Validate Syntax Check
        run: |
          node --check apps/node-app/app.js

  python-validation:
    name: Python Lint & Syntax
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Linting Packages
        run: |
          python -m pip install --upgrade pip
          pip install flake8

      - name: Check flake8 Python Code Style
        run: |
          flake8 apps/python-app/app.py --count --select=E9,F63,F7,F82 --show-source --statistics
